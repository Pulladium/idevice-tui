[project]
name = "idevice-tui"
version = "0.1.0"
description = "A Textual terminal UI for iOS devices on Linux — unified device info, AFC file browsing, live syslog, Legacy iOS Kit hand-off, and checkra1n/palera1n jailbreak launchers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ArtPallad", email = "vozhoart@fel.cvut.cz" }]
keywords = ["ios", "iphone", "ipad", "jailbreak", "checkra1n", "palera1n", "textual", "tui", "afc", "pymobiledevice3", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "pymobiledevice3>=11.1.0",
    "textual>=8.2.8",
]

[project.scripts]
idevice-tui = "idevice_tui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idevice_tui"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes + common errors + import sorting + modern-syntax upgrades. The blind
# `except Exception`/`except: pass` blocks are deliberate best-effort handling in
# a TUI, so those noisier rulesets are intentionally not selected.
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E731"]  # short lambdas in tests read fine

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
